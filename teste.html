<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <title>Telinha | Compartilhamento de tela</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #101214;
        --surface: #191c20;
        --surface-soft: #22262b;
        --border: #30353b;
        --text: #f4f5f6;
        --muted: #9ca3aa;
        --accent: #b8f26b;
        --accent-text: #16200c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        background: var(--background);
        color: var(--text);
        font-family: "Trebuchet MS", sans-serif;
      }

      main {
        width: min(100%, 980px);
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 24px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: bold;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 3.2rem);
        letter-spacing: 0;
      }

      .connection {
        color: var(--muted);
        font-size: 0.86rem;
        white-space: nowrap;
      }

      .connection::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 12px var(--accent);
      }

      .screen {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #090a0b;
        box-shadow: 0 18px 50px rgb(0 0 0 / 25%);
      }

      .screen:fullscreen {
        width: 100vw;
        height: 100vh;
        border: 0;
        border-radius: 0;
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .empty-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 8px;
        color: var(--muted);
        text-align: center;
        pointer-events: none;
      }

      .empty-state strong {
        color: var(--text);
        font-size: 1.1rem;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 16px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .resolution {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      select {
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 10px 12px;
        background: var(--surface-soft);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button {
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 11px 16px;
        background: var(--surface-soft);
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        transition:
          background 160ms ease,
          border-color 160ms ease;
      }

      button:hover:not(:disabled) {
        border-color: var(--accent);
      }

      #startBtn {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-text);
        font-weight: bold;
      }

      #startBtn:hover:not(:disabled) {
        background: #c9fa88;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      @media (max-width: 600px) {
        body {
          padding: 24px 14px;
        }

        header,
        .controls {
          align-items: flex-start;
          flex-direction: column;
        }

        .connection {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">WebRTC / Telinha</p>
          <h1>Sua tela, em foco.</h1>
        </div>
        <span class="connection">PeerJS pronto</span>
      </header>

      <section class="screen" aria-label="Visualização da tela compartilhada">
        <video id="videoElement" autoplay playsinline></video>
        <div class="empty-state" id="emptyState">
          <strong>Nenhuma tela compartilhada</strong>
          <span>Inicie uma sessão para visualizar o conteúdo.</span>
        </div>
      </section>

      <section class="controls" aria-label="Controles de compartilhamento">
        <div class="actions">
          <button id="startBtn">Compartilhar tela</button>
          <button id="stopBtn" disabled>Parar</button>
          <button id="fullscreenBtn">Tela cheia</button>
        </div>
        <label class="resolution" for="resolutionSelect">
          Resolução
          <select id="resolutionSelect">
            <option value="auto">Automática</option>
            <option value="1280x720">720p</option>
            <option value="1920x1080" selected>1080p</option>
            <option value="2560x1440">1440p</option>
          </select>
        </label>
        <label class="resolution" for="frameRateSelect">
          FPS
          <select id="frameRateSelect">
            <option value="auto">Automático</option>
            <option value="30">30</option>
            <option value="60" selected>60</option>
          </select>
        </label>
        <span class="connection" id="status">Aguardando conexão</span>
      </section>
    </main>

    <script>
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const videoElement = document.getElementById("videoElement");
      const screenElement = document.querySelector(".screen");
      const emptyState = document.getElementById("emptyState");
      const status = document.getElementById("status");
      const resolutionSelect = document.getElementById("resolutionSelect");
      const frameRateSelect = document.getElementById("frameRateSelect");
      let captureStream = null;
      const peer = new Peer();
      const idDoAmigo = "id-de-quem-assiste";

      peer.on("open", (id) => {
        console.log("Meu ID é: " + id);
        status.textContent = `ID: ${id}`;
      });

      // Atende chamadas recebidas e exibe o vídeo remoto
      peer.on("call", (chamada) => {
        chamada.answer();

        chamada.on("stream", (fluxoDeVideoRemoto) => {
          videoElement.srcObject = fluxoDeVideoRemoto;
          emptyState.hidden = true;
          status.textContent = "Transmitindo ao vivo";
        });
      });

      // Função para iniciar a captura
      startBtn.addEventListener("click", async () => {
        try {
          // É aqui que a mágica acontece! A API pede permissão ao usuário.
          const selectedResolution = resolutionSelect.value;
          const selectedFrameRate = frameRateSelect.value;
          const videoConstraints = {};

          if (selectedResolution !== "auto") {
            const [width, height] = selectedResolution.split("x").map(Number);
            videoConstraints.width = { ideal: width };
            videoConstraints.height = { ideal: height };
          }

          if (selectedFrameRate !== "auto") {
            const frameRate = Number(selectedFrameRate);
            videoConstraints.frameRate = {
              ideal: frameRate,
              max: frameRate,
            };
          }

          captureStream = await navigator.mediaDevices.getDisplayMedia({
            video:
              Object.keys(videoConstraints).length > 0
                ? videoConstraints
                : true,
            audio: false, // Mude para true se quiser tentar capturar o áudio do sistema
          });

          // Conecta o fluxo de tela capturado à tag <video> do HTML
          videoElement.srcObject = captureStream;
          emptyState.hidden = true;
          status.textContent = "Compartilhamento ativo";

          // Envia o fluxo de vídeo para o outro usuário pelo PeerJS
          peer.call(idDoAmigo, captureStream);

          // Atualiza o estado dos botões
          startBtn.disabled = true;
          stopBtn.disabled = false;

          // Se o usuário clicar em "Parar compartilhamento" na barra nativa do navegador
          captureStream
            .getVideoTracks()[0]
            .addEventListener("ended", stopCapture);
        } catch (err) {
          console.error(
            "Erro: O usuário não deu permissão ou o navegador não suporta.",
            err,
          );
        }
      });

      // Função para parar a captura pelo nosso botão
      stopBtn.addEventListener("click", stopCapture);

      fullscreenBtn.addEventListener("click", async () => {
        if (!document.fullscreenElement) {
          await screenElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      });

      document.addEventListener("fullscreenchange", () => {
        fullscreenBtn.textContent = document.fullscreenElement
          ? "Sair da tela cheia"
          : "Tela cheia";
      });

      function stopCapture() {
        if (captureStream) {
          // Pega todas as faixas (tracks) de vídeo/áudio e as encerra
          let tracks = captureStream.getTracks();
          tracks.forEach((track) => track.stop());

          // Limpa a tag de vídeo
          videoElement.srcObject = null;
          emptyState.hidden = false;
        }

        // Reseta os botões
        startBtn.disabled = false;
        stopBtn.disabled = true;
        status.textContent = "Aguardando conexão";
      }
    </script>
  </body>
</html>
