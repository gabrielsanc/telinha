<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Telinha | Compartilhamento de tela</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">WebRTC / Telinha</p>
          <h1>Sua tela, em foco.</h1>
        </div>
        <span class="connection" id="peerIdDisplay">Conectando...</span>
      </header>

      <section class="screen" aria-label="Visualização da tela compartilhada">
        <video id="videoElement" autoplay playsinline></video>
        <div class="empty-state" id="emptyState">
          <strong>Nenhuma tela compartilhada</strong>
          <span>Inicie uma sessão para visualizar o conteúdo.</span>
        </div>
      </section>

      <section class="sharing-list" aria-labelledby="sharingTitle">
        <h2 id="sharingTitle">Pessoas compartilhando a tela</h2>
        <ul id="sharingPeopleList">
          <li class="empty-list">Ninguém está compartilhando no momento.</li>
        </ul>
      </section>

      <section class="controls" aria-label="Controles de compartilhamento">
        <div class="actions">
          <button id="startBtn">Compartilhar tela</button>
          <button id="stopBtn" disabled>Parar</button>
          <button id="fullscreenBtn">Tela cheia</button>
        </div>
        <label class="resolution" for="resolutionSelect">
          Resolução
          <select id="resolutionSelect">
            <option value="auto">Automática</option>
            <option value="1280x720">720p</option>
            <option value="1920x1080" selected>1080p</option>
            <option value="2560x1440">1440p</option>
          </select>
        </label>
        <label class="resolution" for="frameRateSelect">
          FPS
          <select id="frameRateSelect">
            <option value="auto">Automático</option>
            <option value="30">30</option>
            <option value="60" selected>60</option>
          </select>
        </label>
        <label class="resolution" for="viewerNicknameInput">
          Nickname do espectador
          <input
            id="viewerNicknameInput"
            type="text"
            placeholder="Digite o nickname"
            autocomplete="off"
          />
        </label>
        <span class="connection" id="status">Aguardando conexão</span>
      </section>
    </main>

    <script>
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      const videoElement = document.getElementById("videoElement");
      const screenElement = document.querySelector(".screen");
      const emptyState = document.getElementById("emptyState");
      const status = document.getElementById("status");
      const peerIdDisplay = document.getElementById("peerIdDisplay");
      const resolutionSelect = document.getElementById("resolutionSelect");
      const frameRateSelect = document.getElementById("frameRateSelect");
      const viewerNicknameInput = document.getElementById(
        "viewerNicknameInput",
      );
      const sharingPeopleList = document.getElementById("sharingPeopleList");
      const activeShares = new Map();
      const peerStorageKey = "telinha-nickname";
      let captureStream = null;
      let peer = createPeer();

      configurePeer(peer);

      function configurePeer(peerInstance) {
        peerInstance.on("open", (id) => {
          console.log("Meu nickname é: " + id);
          peerIdDisplay.textContent = `Seu nickname: ${id}`;
          status.textContent = `Nickname: ${id}`;
        });

        peerInstance.on("error", (error) => {
          console.error("Erro do PeerJS:", error);

          if (error.type === "unavailable-id") {
            localStorage.removeItem(peerStorageKey);
            peerInstance.destroy();
            peer = createPeer();
            configurePeer(peer);
            return;
          }

          status.textContent = `Erro no nickname: ${error.type}`;
        });

        peerInstance.on("call", handleIncomingCall);
      }

      function createPeer() {
        let savedId = localStorage.getItem(peerStorageKey);

        if (!savedId) {
          savedId = `pessoa-${crypto.randomUUID().replaceAll("-", "").slice(0, 10)}`;
          localStorage.setItem(peerStorageKey, savedId);
        }

        return new Peer(savedId);
      }

      // Atende chamadas recebidas e exibe o vídeo remoto
      function handleIncomingCall(chamada) {
        chamada.answer();

        chamada.on("stream", (fluxoDeVideoRemoto) => {
          addSharingPerson(chamada.peer, "remoto");
          videoElement.srcObject = fluxoDeVideoRemoto;
          emptyState.hidden = true;
          status.textContent = "Transmitindo ao vivo";
        });

        chamada.on("close", () => removeSharingPerson(chamada.peer));
        chamada.on("error", (error) => {
          console.error("Erro ao receber a tela:", error);
          removeSharingPerson(chamada.peer);
          status.textContent = "Não foi possível receber a tela";
        });
      }

      // Função para iniciar a captura
      startBtn.addEventListener("click", async () => {
        try {
          const idDoAmigo = normalizeNickname(viewerNicknameInput.value);

          if (!idDoAmigo) {
            status.textContent = "Informe o nickname do espectador";
            viewerNicknameInput.focus();
            return;
          }

          // É aqui que a mágica acontece! A API pede permissão ao usuário.
          const selectedResolution = resolutionSelect.value;
          const selectedFrameRate = frameRateSelect.value;
          const videoConstraints = {};

          if (selectedResolution !== "auto") {
            const [width, height] = selectedResolution.split("x").map(Number);
            videoConstraints.width = { ideal: width };
            videoConstraints.height = { ideal: height };
          }

          if (selectedFrameRate !== "auto") {
            const frameRate = Number(selectedFrameRate);
            videoConstraints.frameRate = {
              ideal: frameRate,
              max: frameRate,
            };
          }

          captureStream = await navigator.mediaDevices.getDisplayMedia({
            video:
              Object.keys(videoConstraints).length > 0
                ? videoConstraints
                : true,
            audio: false, // Mude para true se quiser tentar capturar o áudio do sistema
          });

          await waitForPeerOpen();

          // Conecta o fluxo de tela capturado à tag <video> do HTML
          videoElement.srcObject = captureStream;
          emptyState.hidden = true;
          status.textContent = `Conectando ao espectador ${idDoAmigo}`;

          // Envia o fluxo de vídeo para o outro usuário pelo PeerJS
          const chamada = peer.call(idDoAmigo, captureStream);
          addSharingPerson("Você", "local");
          chamada.on("close", () => removeSharingPerson("Você"));
          chamada.on("error", (error) => {
            console.error("Erro ao enviar a tela:", error);
            removeSharingPerson("Você");
            status.textContent = "Espectador não encontrado ou desconectado";
          });

          // Atualiza o estado dos botões
          startBtn.disabled = true;
          stopBtn.disabled = false;

          // Se o usuário clicar em "Parar compartilhamento" na barra nativa do navegador
          captureStream
            .getVideoTracks()[0]
            .addEventListener("ended", stopCapture);
        } catch (err) {
          console.error(
            "Erro: O usuário não deu permissão ou o navegador não suporta.",
            err,
          );
          status.textContent = "Não foi possível iniciar o compartilhamento";
          stopCapture();
        }
      });

      // Função para parar a captura pelo nosso botão
      stopBtn.addEventListener("click", stopCapture);

      fullscreenBtn.addEventListener("click", async () => {
        if (!document.fullscreenElement) {
          await screenElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      });

      document.addEventListener("fullscreenchange", () => {
        fullscreenBtn.textContent = document.fullscreenElement
          ? "Sair da tela cheia"
          : "Tela cheia";
      });

      function stopCapture() {
        if (captureStream) {
          // Pega todas as faixas (tracks) de vídeo/áudio e as encerra
          let tracks = captureStream.getTracks();
          tracks.forEach((track) => track.stop());

          // Limpa a tag de vídeo
          videoElement.srcObject = null;
          emptyState.hidden = false;
        }

        // Reseta os botões
        startBtn.disabled = false;
        stopBtn.disabled = true;
        status.textContent = "Aguardando conexão";
        removeSharingPerson("Você");
      }

      function waitForPeerOpen() {
        if (peer.open) return Promise.resolve();

        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            reject(new Error("O PeerJS não ficou pronto a tempo"));
          }, 10000);

          peer.once("open", () => {
            clearTimeout(timeout);
            resolve();
          });

          peer.once("error", (error) => {
            clearTimeout(timeout);
            reject(error);
          });
        });
      }

      function normalizeNickname(nickname) {
        return nickname
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9_-]/g, "-")
          .replace(/-+/g, "-")
          .replace(/^-|-$/g, "");
      }

      function addSharingPerson(peerId, type) {
        activeShares.set(peerId, type);
        renderSharingPeople();
      }

      function removeSharingPerson(peerId) {
        activeShares.delete(peerId);
        renderSharingPeople();
      }

      function renderSharingPeople() {
        sharingPeopleList.replaceChildren();

        if (activeShares.size === 0) {
          const emptyItem = document.createElement("li");
          emptyItem.className = "empty-list";
          emptyItem.textContent = "Ninguém está compartilhando no momento.";
          sharingPeopleList.append(emptyItem);
          return;
        }

        activeShares.forEach((type, peerId) => {
          const personItem = document.createElement("li");
          personItem.textContent = type === "local" ? "Sua tela" : peerId;
          sharingPeopleList.append(personItem);
        });
      }
    </script>
  </body>
</html>
